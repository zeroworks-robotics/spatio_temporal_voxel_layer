costmap:
  costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link
      # Not the knob that keeps the grid from being wiped -- that is
      # stvl_layer.transform_tolerance below, and the two are unrelated despite the
      # shared name. Costmap2DROS spends this one in getRobotPose(), which asks for
      # the latest common time and so almost never waits on a tf gap. Raised to 1.0
      # only so the two values stop reading as if they disagreed.
      transform_tolerance: 1.0

      update_frequency: 15.0
      publish_frequency: 15.0
      always_send_full_costmap: true
      # Master-level, distinct from the stvl_layer copy below: Costmap2DROS reads
      # this one to choose the master grid's default value. Without it the master
      # is reset to FREE_SPACE every cycle and unobserved space is reported clear.
      track_unknown_space: false

      rolling_window: true
      # 18 m. The 14 above rested on the planner window being robot-CENTRED, and it is
      # not. planner_yn.cpp:856,859 build a 500x500 px window at m2pixel 50 (0.02 m/px,
      # so 10 x 10 m) with robot_on_grid = (250, 350) -- not (250, 250). Reading that
      # through the CoNA pixel convention (row = gcy - k*x_rel, x_rel forward) the window
      # reaches 7.00 m ahead, 2.98 m behind and 5.00 m to each side: it looks forward.
      #
      # So the corner farthest from the robot is the front one, sqrt(7.0^2 + 5.0^2) =
      # 8.60 m, and the window rotates with the heading, so an axis-aligned costmap has
      # to carry half-extent 8.60 m -- 17.2 m square -- to cover it at every heading.
      # At 14 (half-extent 7.0) the front corners leave the costmap by up to 1.60 m near
      # 45-degree headings, and getLocalCostmap's warpAffine fills what it cannot read
      # with BORDER_CONSTANT 125, unobserved (cona_bridge.cpp:229). That is the hole seen
      # in the local planner image on the gochuck bags. 18 covers 8.60 with 0.40 to spare.
      #
      # The cost is cells, not voxels: obstacle_range bounds the voxel count and is
      # unchanged, while worldToMap stops rejecting the ones that were being computed and
      # thrown away. 350^2 = 122,500 -> 450^2 = 202,500 cells for resetMaps,
      # updateWithOverwrite and the published grid.
      width: 18
      height: 18
      resolution: 0.04

      # Chassis is 0.80 x 0.70 (half 0.40 x 0.35); this polygon is one voxel (0.04)
      # larger per side. Clearing tests cell CENTRES, and the voxel containing the
      # body surface centres at ~0.415 m -- outside a 0.40 polygon, so the body
      # edge survived in 194/194 frames until this margin was added. Clearing only:
      # CoNA 0_General keeps the true size for collision checking.
      footprint: "[[0.44, 0.39], [0.44, -0.39], [-0.44, -0.39], [-0.44, 0.39]]"

      plugins: ["stvl_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled:                  true
        voxel_decay:              1.0    # trail length; 10 frames of slack at the 10 Hz integration rate
        decay_model:              0      # 0=linear, 1=exponential, -1=persistent
        voxel_size:               0.04   # meters
        track_unknown_space:      false
        # Voxels stacked in a 2D cell before it is marked lethal. 0 marks on a single
        # voxel; raising it trades recall for stability, and short obstacles are what
        # is lost first, so re-check that a 15 cm object still registers after changing
        # this.
        mark_threshold:           2
        update_footprint_enabled: true
        combination_method:       0      # 0=Overwrite: keeps NO_INFORMATION, which Max discards
        origin_z:                 0.0
        publish_voxel_map:        false  # 3D grid for RViz; off in production
        # How long the tf2 MessageFilter waits for map->sensor before discarding the
        # cloud. Sized from the localiser, not from a round number: zw_localization
        # publishes map->odom only on a global filter update and skips the scan
        # outright when the odom lookup misses, so its stamp gaps are 100 ms for 92%
        # of samples but reach 946 ms in a burst. At 0.5 that tail threw away 6.4% of
        # a 10 Hz source and starved the grid past voxel_decay 12 times in 500 s;
        # 1.0 covers the worst gap and drops 0.58%. The cost is latency, not accuracy
        # -- tf2 still interpolates the cloud's own stamp, it just arrives later.
        # The master transform_tolerance above is a different knob and is not what
        # fixes this: getRobotPose asks for the latest common time, so it never waits
        # on a gap.
        #
        # Confirmed on the robot at up to 1.3 m/s, same route both times. At 0.5:
        # 14 collapses in 198 s, 24 frames with the costmap completely blank, 54
        # dropped clouds. At 1.0: 2 collapses in 210 s, 0.10 s each, never below 722
        # lethal cells, 6 dropped clouds. The tf gaps were the same either way
        # (721 vs 740 ms worst) -- only the waiting changed.
        transform_tolerance:      1.0
        # A source whose topic ends in topic_fallback_suffix falls back to the name without
        # it when nothing publishes the processed topic within topic_fallback_wait seconds.
        # The wait is what makes it usable at bring-up: the costmap is configured at about
        # the moment the producer starts, and a single check would lose that race and drop to
        # the raw topic permanently. 0 disables the fallback and the source simply stays dark.
        topic_fallback_wait:      3.0
        topic_fallback_suffix:    "_deskewed"
        mapping_mode:             false
        map_save_duration:        60.0

        observation_sources: >
          front_mark front_clear
          left_mark left_clear
          right_mark right_clear
          fdown_mark fdown_clear
          back_mark back_clear
          lidar_mark lidar_clear

        # ---------------- front RGBD (level, +x) ----------------
        front_mark:
          data_type: PointCloud2
          topic: /camera_frontRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        front_clear:
          data_type: PointCloud2
          topic: /camera_frontRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1472    # 65.7 deg, from fx=371.49
          horizontal_fov_angle: 1.4222  # 81.5 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- left RGBD (20 deg down, +72 deg yaw) ----------------
        left_mark:
          data_type: PointCloud2
          topic: /camera_leftRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        left_clear:
          data_type: PointCloud2
          topic: /camera_leftRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1376    # 65.2 deg, from fx=375.43
          horizontal_fov_angle: 1.4117  # 80.9 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- right RGBD (20 deg down, -72 deg yaw) ----------------
        right_mark:
          data_type: PointCloud2
          topic: /camera_rightRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        right_clear:
          data_type: PointCloud2
          topic: /camera_rightRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1300    # 64.7 deg, from fx=378.59
          horizontal_fov_angle: 1.4035  # 80.4 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- back RGBD (55 deg down, 180 deg yaw) ----------------
        back_mark:
          data_type: PointCloud2
          topic: /camera_rearRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        back_clear:
          data_type: PointCloud2
          topic: /camera_rearRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1494    # 65.9 deg, from fx=370.57
          horizontal_fov_angle: 1.4246  # 81.6 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- front-down RGBD (55 deg down) ----------------
        fdown_mark:
          data_type: PointCloud2
          topic: /camera_fdownRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 2.5
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        fdown_clear:
          data_type: PointCloud2
          topic: /camera_fdownRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 3.0
          vertical_fov_angle: 1.1274    # 64.6 deg, from fx=379.68
          horizontal_fov_angle: 1.4006  # 80.2 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- RoboSense Airy 3D LiDAR ----------------
        lidar_mark:
          data_type: PointCloud2
          # De-skewed, not raw. The RSAIRY sweeps 360 deg in 100 ms and the driver stamps the
          # cloud with its FIRST point (rslidar_sdk config.yaml: ts_first_point: true), so a
          # single transform places everything captured later in the sweep as if the robot had
          # not moved. Measured: at 2 rad/s a wall 5 m out is displaced up to 1 m, and rotation
          # costs 10.4% of the cells the chassis could stand in. Feeding the relay's output
          # recovers 37% of that, and 103% together with an odom-anchored grid.
          #
          # rslidar_sdk/rslidar_deskew_node produces this; it comes up with the lidar
          # (AIRY_DESKEW=0 turns it off). If nothing publishes it, the layer falls back to
          # /rslidar_points after stvl_layer.topic_fallback_wait and says so at WARN.
          topic: /rslidar_points_deskewed
          marking: true
          clearing: false
          # 14 m, the costmap's own width. The window can only ever render 7*sqrt(2) =
          # 9.9 m to its corner, and nothing downstream consumes voxels past that:
          # /costmap/voxel_grid's only subscriber is rviz, and Planner_v2 reads
          # /costmap/costmap. At 20 m a median 6.8% of live voxels sat outside the
          # window (35.1% in open space), each one walked every cycle by
          # TemporalClearAndGenerateCostmap and then dropped by worldToMap.
          obstacle_range: 14.0
          min_obstacle_height: 0.08
          # 1.50, while the five cameras are still at 1.20. Deliberate for now, but the
          # bands should agree: CoNA puts the chassis at 1.3 m, so 1.20 stops below the
          # robot's own roofline and something at 1.25 m is seen by the lidar alone.
          max_obstacle_height: 1.50    # 1.50 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          # 1, not the 2 the cameras use. 2 was set in 88bd7a2 when this file had only
          # five cameras ranged at 3.0/2.5 m and mark_threshold was 3; the lidar block
          # arrived later and inherited the number without anyone measuring it against
          # lidar density. Measured on one RSAIRY scan (84713 points, 4 cm voxels), the
          # share of voxels holding 2+ returns is 81.0% at 0-2 m, 18.9% at 4-6 m, 1.4%
          # at 6-8 m and 0.0% beyond 8 m -- so 2 was silently capping the lidar at about
          # 6 m no matter what obstacle_range said. Single strays are still filtered,
          # just one stage later: one point makes one voxel, and mark_threshold 2 needs
          # two stacked in a column before the cell goes lethal.
          voxel_min_points: 1
          clear_after_reading: true
        lidar_clear:
          data_type: PointCloud2
          # Same source as lidar_mark, for the same reason. Clearing has to agree with marking
          # about where the points are, or the frustum clears voxels the marking never put there.
          topic: /rslidar_points_deskewed
          marking: false
          clearing: true
          min_z: 0.2                    # RSAIRY min_distance
          # Inert while decay_acceleration is 0.0: a voxel inside the frustum gets
          # base_duration_to_decay - 0, which is what one outside gets anyway, so the
          # far plane changes nothing. Kept at the deployed value; it only starts to
          # matter if decay_acceleration ever goes non-zero.
          max_z: 15.0
          vertical_fov_angle: 1.5708    # 90 deg dome
          horizontal_fov_angle: 6.2832  # >6.27 -> full 360 mode
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 1                 # 3D lidar hourglass frustum
          clear_after_reading: true
