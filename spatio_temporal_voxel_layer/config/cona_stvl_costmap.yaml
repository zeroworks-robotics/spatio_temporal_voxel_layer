costmap:
  costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5

      update_frequency: 15.0
      publish_frequency: 15.0
      always_send_full_costmap: true
      # Master-level, distinct from the stvl_layer copy below: Costmap2DROS reads
      # this one to choose the master grid's default value. Without it the master
      # is reset to FREE_SPACE every cycle and unobserved space is reported clear.
      track_unknown_space: false

      rolling_window: true
      # 14 m, not 16: the planner resamples this into a robot-centred 10x10 m window
      # that rotates with the robot, so an axis-aligned costmap needs 10*sqrt(2) =
      # 14.14 m to cover it at any heading. 14 clips only the extreme diagonal
      # corners by 7 cm while dropping 23% of the cells (160k -> 122k).
      width: 14
      height: 14
      resolution: 0.04

      # Chassis is 0.80 x 0.70 (half 0.40 x 0.35); this polygon is one voxel (0.04)
      # larger per side. Clearing tests cell CENTRES, and the voxel containing the
      # body surface centres at ~0.415 m -- outside a 0.40 polygon, so the body
      # edge survived in 194/194 frames until this margin was added. Clearing only:
      # CoNA 0_General keeps the true size for collision checking.
      footprint: "[[0.44, 0.39], [0.44, -0.39], [-0.44, -0.39], [-0.44, 0.39]]"

      plugins: ["stvl_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled:                  true
        voxel_decay:              1.0    # trail length; 10 frames of slack at the 10 Hz integration rate
        decay_model:              0      # 0=linear, 1=exponential, -1=persistent
        voxel_size:               0.04   # meters
        track_unknown_space:      false
        # Voxels stacked in a 2D cell before it is marked lethal. 0 marks on a single
        # voxel; raising it trades recall for stability, and short obstacles are what
        # is lost first, so re-check that a 15 cm object still registers after changing
        # this.
        mark_threshold:           2
        update_footprint_enabled: true
        combination_method:       0      # 0=Overwrite: keeps NO_INFORMATION, which Max discards
        origin_z:                 0.0
        publish_voxel_map:        false  # 3D grid for RViz; off in production
        # How long the tf2 MessageFilter waits for map->sensor before discarding the
        # cloud. Sized from the localiser, not from a round number: zw_localization
        # publishes map->odom only on a global filter update and skips the scan
        # outright when the odom lookup misses, so its stamp gaps are 100 ms for 92%
        # of samples but reach 946 ms in a burst. At 0.5 that tail threw away 6.4% of
        # a 10 Hz source and starved the grid past voxel_decay 12 times in 500 s;
        # 1.0 covers the worst gap and drops 0.58%. The cost is latency, not accuracy
        # -- tf2 still interpolates the cloud's own stamp, it just arrives later.
        # The master transform_tolerance above stays 0.5: getRobotPose asks for the
        # latest common time, so it never waits on a gap.
        transform_tolerance:      1.0
        mapping_mode:             false
        map_save_duration:        60.0

        observation_sources: >
          front_mark front_clear
          left_mark left_clear
          right_mark right_clear
          fdown_mark fdown_clear
          back_mark back_clear
          lidar_mark lidar_clear

        # ---------------- front RGBD (level, +x) ----------------
        front_mark:
          data_type: PointCloud2
          topic: /camera_frontRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        front_clear:
          data_type: PointCloud2
          topic: /camera_frontRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1472    # 65.7 deg, from fx=371.49
          horizontal_fov_angle: 1.4222  # 81.5 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- left RGBD (20 deg down, +72 deg yaw) ----------------
        left_mark:
          data_type: PointCloud2
          topic: /camera_leftRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        left_clear:
          data_type: PointCloud2
          topic: /camera_leftRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1376    # 65.2 deg, from fx=375.43
          horizontal_fov_angle: 1.4117  # 80.9 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- right RGBD (20 deg down, -72 deg yaw) ----------------
        right_mark:
          data_type: PointCloud2
          topic: /camera_rightRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        right_clear:
          data_type: PointCloud2
          topic: /camera_rightRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1300    # 64.7 deg, from fx=378.59
          horizontal_fov_angle: 1.4035  # 80.4 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- back RGBD (55 deg down, 180 deg yaw) ----------------
        back_mark:
          data_type: PointCloud2
          topic: /camera_rearRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        back_clear:
          data_type: PointCloud2
          topic: /camera_rearRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1494    # 65.9 deg, from fx=370.57
          horizontal_fov_angle: 1.4246  # 81.6 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- front-down RGBD (55 deg down) ----------------
        fdown_mark:
          data_type: PointCloud2
          topic: /camera_fdownRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 2.5
          min_obstacle_height: 0.12
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
        fdown_clear:
          data_type: PointCloud2
          topic: /camera_fdownRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 3.0
          vertical_fov_angle: 1.1274    # 64.6 deg, from fx=379.68
          horizontal_fov_angle: 1.4006  # 80.2 deg
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 0
          clear_after_reading: true

        # ---------------- RoboSense Airy 3D LiDAR ----------------
        lidar_mark:
          data_type: PointCloud2
          topic: /rslidar_points
          marking: true
          clearing: false
          obstacle_range: 8.0
          min_obstacle_height: 0.08
          max_obstacle_height: 1.20    # 1.20 m above the chassis, per height_filter_frame
          height_filter_frame: base_link   # gate height in the robot's frame, not the
                                           # world's, so the band tilts on a ramp
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 2   # 1 let a single stray return mark an obstacle
          clear_after_reading: true
        lidar_clear:
          data_type: PointCloud2
          topic: /rslidar_points
          marking: false
          clearing: true
          min_z: 0.2                    # RSAIRY min_distance
          max_z: 10.0
          vertical_fov_angle: 1.5708    # 90 deg dome
          horizontal_fov_angle: 6.2832  # >6.27 -> full 360 mode
          decay_acceleration: 0.0    # any non-zero value behaves the same (cubic); trail length is set by voxel_decay
          model_type: 1                 # 3D lidar hourglass frustum
          clear_after_reading: true
