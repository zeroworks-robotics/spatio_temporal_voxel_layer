# Door variant of cona_stvl_costmap.yaml (the robot config), branch features/stvl_lidar_decay. Needs that branch.
# Changes against the robot config, each aimed at door frames, measured against the field tape of 12 entrance
# doors (0.90-1.47 m, 2026-10-27):
#   * resolution / voxel_size 0.04 -> 0.02 m: a cell holding any part of a frame is filled whole, so the
#     rounding loss per side halves.
#   * *_mark.support_filter_min 1 (lidar rows wrap): a return needs a same-range neighbour in its organized
#     cloud; single stray returns (rain, speckle) go. Camera voxel_min_points 2 -> 1 with it.
#   * lidar_mark.voxel_decay 0.25 within voxel_decay_range 2.5 m: door-frame spread near the lidar is
#     forgotten fast; farther marks keep the layer's 1 s, so an object hit by only a ring or two far away
#     still collects its marks (child-height box 4-8 m: 94-98 % with the lidar alone, robot config 96-99 %).
#   * decay_hold_grace 0.15 / decay_hold_max 0.85: once the lidar (the short-life source) is late by more than
#     0.15 s - a dropped scan or a stalled cycle - voxels stop ageing until it is 1.0 s late, so its near marks
#     are not lost in a gap up to about 0.95 s; after that, ageing is exactly the normal one again.
#   * footprint +-0.40 x +-0.30 m: the robot's body as cona_robot gives it (cona_bringup
#     param/cona_grid_map_ranger_mini_v3.yaml); the footprint clearing must not reach past the body.
#   * lidar_mark.range_bias_k 0.025 (max 0.025): the Airy reads 1-3 cm short at 0.5-1.5 m against all three
#     cameras on every surface; returns are pushed back out horizontally, by at most 2.5 cm.
#   * *_mark.edge_filter_px 1: depth cameras widen a near surface by about a pixel at a depth step; that
#     pixel goes on surfaces 4 px or wider.
#   * door_trim layer: at the map's door nodes, one 2 cm cell comes off the face toward the opening of
#     each run beside the free path, only where that face is wider than the cell (a thin pole or door leaf
#     next to the jamb is kept whole). Rows with anything on the node (closed door, person on the path)
#     are left whole. A person standing in the zone beside the path can lose that one cell too.
#     map_file must name the site's map.json; empty = this layer off.
#   * update 20 Hz and publish 40 Hz, as the robot config (publish 20 with update 20 sends only ~13 maps/s).
#   * mark_threshold_far 1 beyond mark_threshold_far_range 2.5 m of the lidar (centre_x = its mount): at 2 cm
#     a far return is too sparse to stack two voxels in a column, so mark_threshold 2 capped the lidar near 3 m.
#     Replay of 2026-10-23 16:36 (moving returns, 0.25 s lag), 5-7 / 7-14 m: threshold 2 everywhere
#     39.7 / 26.4 %, the robot config 79.3 / 64.3 %; a person approaching was first marked at 4.2 m against
#     6.8 m. Threshold 1 everywhere recovers the far field but costs the doors (inside -12.1 % vs -9.2 %), so
#     it is gated: within 2.5 m of the lidar this file marks exactly as before. That holds every jamb sample
#     before (front end <= 2.0 m from the door, jambs <= 2.3 m) and inside a door; after it, the jambs pass
#     2.5 m once the rear end is about 1.75 m beyond the door. The count is over all sources, so camera
#     voxels 2.5 m and more from the lidar (cameras mark to 3.0 m from their own mounts) need one voxel too.
#     A door farther than 2.5 m ahead is drawn at threshold 1 until the robot is within 2.5 m of it.
#   * lidar_mark.door_trust (needs door_zones.map_file): in the map's door zones (|s| <= 0.8, |l| <= 1.0 around
#     a gate node, as door_trim), the Airy reads a jamb it meets head-on within 1.3 m 2-8 cm short in the band
#     the costmap marks (0.08-1.5 m), while the rings above (1.5-1.8 m) read it where it is. A jamb is the same
#     width at every height, so a lower return that is 1..10 cm nearer than the 1.5-1.8 m face in its 1 deg
#     azimuth (+-1 bin) is not marked, and the 1.5-1.8 m band is marked inside the zones within 1.4 m, but only
#     where the lower band has a return within 10 cm of it in that azimuth (a jamb, a leaf stile, a person), so a
#     lintel or a sign with nothing below it is never marked. A lower return goes only when such a kept upper
#     returns at three heights lie within 2 cells (4-6 cm) of where its beam meets the face, so the costmap keeps a column right
#     where anything was let go (a jamb in the lidar's thin frontal sector, held by one camera voxel and one lidar voxel,
#     lost its face otherwise). No point is moved; nothing taller behind a return (a child, a box, a person in
#     the opening) leaves it as it is.
#     Replay of the 2026-10-23 doors (24 passages, 779 samples), costmap width against tape before / inside /
#     after: -6.9 / -9.3 / -5.6 % -> -5.8 / -5.8 / -5.2 %; closed-door moments 190 / 192 (191 before, the lost
#     one sits at the edge of the +-15 cm test row); far1 unchanged. Orin: 1.16 -> 1.21 cores, cycle mean +1.5 ms
#     with the rule on every cloud. Residual: a low protrusion 1..10 cm (plus the 4-6 cm confirmation window) in
#     front of a full-height face (a panic bar) is drawn at that face; cameras (0.12-1.2 m) still mark it.
#     It runs at a door only while the robot's centre, projected on the door's axis, is between the standby
#     nodes (gate_standby) before and after it (1.5-3 m out) or within 2 m of the door node, whichever reaches
#     farther; doors in a row (mall B, 3.7 m apart) keep it on between them. Map nodes and the localizer only.
#     Rule off (today's cloud) when the map pose is missing or older than door_zones.max_tf_age, no door is
#     within reach, or the cloud is not in the sensor frame; `ros2 param set /costmap/costmap
#     stvl_layer.lidar_mark.door_trust false|true` switches it off and on while running. Every 30 s lidar_mark logs how often it ran and
#     what it dropped. Points beyond obstacle_range are now cut before the VoxelGrid (voxel filter, no sensor_frame): PCL
#     returns the cloud unfiltered (NaN, floor, ceiling) when its index box passes INT32 voxels, which a 2 cm
#     leaf reached on wide views ("Leaf size is too small", 63 times in the far1 replay before this).
# Pre-gate numbers below (measured before mark_threshold_far): replay of the 2026-10-23 recording (large
# clouds over shared memory, as on the robot), door width against
# tape (median of 12 doors), before / inside / after the door: the robot's own live costmap that day
# -12.9 / -13.1 / -12.7 %, this file -6.4 / -9.0 / -5.4 %. Closed-door moments kept 191/192, false cells in
# the driven path 0.3 % of costmaps (robot config 0.3 %), costmap 20.0 Hz. Orin (.151, 4 windows): 1.19 cores,
# cycle mean 10-15 ms, max 43 ms, no missed cycle (robot config 0.86 cores on the same windows).
# The lidar marks only objects taller than about 1 m (it sees from its own height up); cameras cover
# 0.12-1.2 m within 3 m. Not tested on the robot yet.
costmap:
  costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 1.0
      update_frequency: 20.0
      publish_frequency: 40.0
      always_send_full_costmap: true
      track_unknown_space: false
      rolling_window: true
      width: 18
      height: 18
      resolution: 0.02
      footprint: '[[0.40, 0.30], [0.40, -0.30], [-0.40, -0.30], [-0.40, 0.30]]'
      plugins:
      - stvl_layer
      - denoise_layer
      - door_trim
      door_trim:
        plugin: spatio_temporal_voxel_layer/DoorTrimLayer
        enabled: true
        map_file: ''   # set to the site's map.json, the one cona loads; empty = layer off
        map_frame: map
        place_types: [gate_private, gate_public]
        floor: 1
        require_zone_edge: false
        trim: 0.02
        zone_half_depth: 0.8
        zone_half_width: 1.0
        min_wall_run: 0.10
        bridge_gap: 0.04
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 1.0
        decay_model: 0
        decay_hold_grace: 0.15   # lidar late by this much (10 Hz = 0.10 s) ...
        decay_hold_max: 0.85     # ... stops voxel ageing until it is this much later still
        voxel_size: 0.02
        track_unknown_space: false
        mark_threshold: 2
        mark_threshold_far: 1              # beyond the range below (header note)
        mark_threshold_far_range: 2.5      # m from the centre below
        mark_threshold_far_centre_x: 0.2266  # base_link x of the lidar mount
        door_zones:                 # for lidar_mark.door_trust below; keep equal to door_trim's
          map_file: ''              # the site's map.json, as door_trim.map_file; empty = door_trust off
          map_frame: map
          place_types: [gate_private, gate_public]
          floor: 1
          zone_half_width: 1.0
          zone_half_depth: 0.8
          max_tf_age: 2.0
          trigger_type: gate_standby   # door trust only while the robot is between a door's standby nodes; '' = always
          trigger_margin: 0.10
          trigger_min_reach: 2.0       # ... and at least 2 m past the door node either way
        update_footprint_enabled: true
        combination_method: 0
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 1.0
        topic_fallback_wait: 3.0
        topic_fallback_suffix: _deskewed
        ground_relative_height: true
        ground_min_obstacle_height: 0.05
        ground_seed_z_tol: 0.1
        ground_seed_z_tol_per_m: 0.0
        ground_seed_gravity_aligned: true
        ground_max_grade_deg: 20.0
        ground_height_tol: 0.02
        ground_height_tol_per_m: 0.01
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: 'front_mark front_clear left_mark left_clear right_mark
          right_clear fdown_mark fdown_clear back_mark back_clear lidar_mark lidar_clear

          '
        front_mark:
          edge_filter_px: 1
          edge_filter_min_run: 4
          ground_reference_use: true
          data_type: PointCloud2
          topic: /camera_frontRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.2
          height_filter_frame: base_link
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 1
          clear_after_reading: true
          support_filter_min: 1
        front_clear:
          data_type: PointCloud2
          topic: /camera_frontRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1472
          horizontal_fov_angle: 1.4222
          decay_acceleration: 0.0
          model_type: 0
          clear_after_reading: true
        left_mark:
          edge_filter_px: 1
          edge_filter_min_run: 4
          ground_reference_use: true
          data_type: PointCloud2
          topic: /camera_leftRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.2
          height_filter_frame: base_link
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 1
          clear_after_reading: true
          support_filter_min: 1
        left_clear:
          data_type: PointCloud2
          topic: /camera_leftRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1376
          horizontal_fov_angle: 1.4117
          decay_acceleration: 0.0
          model_type: 0
          clear_after_reading: true
        right_mark:
          edge_filter_px: 1
          edge_filter_min_run: 4
          ground_reference_use: true
          data_type: PointCloud2
          topic: /camera_rightRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.2
          height_filter_frame: base_link
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 1
          clear_after_reading: true
          support_filter_min: 1
        right_clear:
          data_type: PointCloud2
          topic: /camera_rightRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.13
          horizontal_fov_angle: 1.4035
          decay_acceleration: 0.0
          model_type: 0
          clear_after_reading: true
        back_mark:
          edge_filter_px: 1
          edge_filter_min_run: 4
          ground_reference_use: true
          data_type: PointCloud2
          topic: /camera_rearRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: 0.12
          max_obstacle_height: 1.2
          height_filter_frame: base_link
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 1
          clear_after_reading: true
          support_filter_min: 1
        back_clear:
          data_type: PointCloud2
          topic: /camera_rearRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 4.0
          vertical_fov_angle: 1.1494
          horizontal_fov_angle: 1.4246
          decay_acceleration: 0.0
          model_type: 0
          clear_after_reading: true
        fdown_mark:
          edge_filter_px: 1
          edge_filter_min_run: 4
          ground_reference_publish: true
          data_type: PointCloud2
          topic: /camera_fdownRGBD/depth/points
          marking: true
          clearing: false
          obstacle_range: 2.5
          min_obstacle_height: 0.12
          max_obstacle_height: 1.2
          height_filter_frame: base_link
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 1
          clear_after_reading: true
          support_filter_min: 1
        fdown_clear:
          data_type: PointCloud2
          topic: /camera_fdownRGBD/depth/points
          marking: false
          clearing: true
          min_z: 0.1
          max_z: 3.0
          vertical_fov_angle: 1.1274
          horizontal_fov_angle: 1.4006
          decay_acceleration: 0.0
          model_type: 0
          clear_after_reading: true
        lidar_mark:
          range_bias_k: 0.025
          range_bias_max: 0.025
          voxel_decay: 0.25
          voxel_decay_range: 2.5
          ground_relative_height: false
          data_type: PointCloud2
          topic: /rslidar_points_deskewed
          marking: true
          clearing: false
          obstacle_range: 14.0
          min_obstacle_height: 0.08
          max_obstacle_height: 1.5
          height_filter_frame: base_link
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: voxel
          voxel_min_points: 1
          clear_after_reading: true
          support_filter_min: 1
          support_filter_wrap_rows: true
          door_trust: true                 # header note; needs door_zones.map_file above
          door_trust_up_max: 1.8
          door_trust_range: 1.3
          door_trust_margin: 0.01
          door_trust_depth: 0.10
          door_trust_az_bin_deg: 1.0
          door_trust_az_neighbours: 1
          door_trust_low_cap_height: 0.90
          door_trust_low_cap_depth: 0.03
        lidar_clear:
          data_type: PointCloud2
          topic: /rslidar_points_deskewed
          marking: false
          clearing: true
          min_z: 0.2
          max_z: 15.0
          vertical_fov_angle: 1.5708
          horizontal_fov_angle: 6.2832
          decay_acceleration: 0.0
          model_type: 1
          clear_after_reading: true
      denoise_layer:
        plugin: nav2_costmap_2d::DenoiseLayer
        enabled: true
        minimal_group_size: 3
        group_connectivity_type: 8
